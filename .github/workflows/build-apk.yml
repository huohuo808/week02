name: 构建安卓 APK

# 把本工程上传到 GitHub 仓库后，此工作流会自动编译出可安装的 APK。
# 触发方式：
#   1. push 代码到任意分支
#   2. 或在 GitHub 网页 Actions 页面手动点 "Run workflow"

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（接受许可 + 补齐编译平台）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SM="$ANDROID_HOME/tools/bin/sdkmanager"
          else
            SM=$(command -v sdkmanager || true)
          fi
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 删除本机 SDK 路径配置（云环境自动识别）
        run: rm -f android/local.properties

      - name: 编译 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 找到 APK 并重命名
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "找到: $APK"
          cp "$APK" "诉讼策略助手.apk"

      - name: 上传 APK 作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 诉讼策略助手-APK
          path: 诉讼策略助手.apk
          retention-days: 90

      - name: 输出下载提示
        run: echo "构建完成！到本页下方 Artifacts 下载「诉讼策略助手-APK」"
