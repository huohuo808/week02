<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="诉讼策略助手 - 移动端 APP">
<meta name="theme-color" content="#16243b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>诉讼策略助手</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/mobile.css">
</head>
<body class="app-mode">
<div class="stage">
  <aside class="intro" style="display:none"></aside>
  <div class="phone">
    <div class="bar">
      <span class="back" id="back" style="display:none" onclick="goBack()">‹</span>
      <span id="barTitle">诉讼策略助手</span>
      <span class="bar-setting" onclick="openServerSetting()" title="服务器设置">⚙</span>
    </div>
    <div class="screen" id="screen">
      <div class="loading"><div class="spin"></div><p>正在连接后端服务…</p></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="modalHost"></div>
  </div>
</div>

<div id="settingHost"></div>

<div id="installTip" class="install-tip" style="display:none">
  <div class="it-card">
    <div class="it-close" onclick="closeInstallTip()">✕</div>
    <h4>把 APP 装到手机桌面</h4>
    <p id="itGuide">点浏览器菜单 →「添加到主屏幕」，即可像普通 APP 一样全屏打开。</p>
    <button id="installBtn" class="it-btn" style="display:none" onclick="doInstall()">一键安装到桌面</button>
    <div class="it-note" id="itNote"></div>
  </div>
</div>

<script src="/app-config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/mobile.js"></script>
<script>
// 注册 Service Worker（PWA 可安装的前提）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}
// 捕获安卓 Chrome 的安装提示，转成我们的自定义按钮
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferredPrompt = e;
  window.deferredPrompt = e;
  var btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'inline-block';
});
</script>
</body>
</html>
